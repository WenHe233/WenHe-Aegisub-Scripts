name: DependencyControl

on:
  pull_request:
    paths: ['macros/**', 'modules/**', 'apps/**', 'tools/**', 'tests/**', 'DependencyControl.json', 'requirements-ci.txt', '.github/workflows/dependency-control.yml']
  push:
    branches: [main]
    paths: ['macros/**', 'modules/**', 'apps/**', 'tools/**', 'tests/**', 'DependencyControl.json', 'requirements-ci.txt', '.github/workflows/dependency-control.yml']

concurrency:
  group: dependency-control-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            apps/ass-tracker/requirements*.txt
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-ci.txt -r apps/ass-tracker/requirements-build.txt lupa==2.8
      - name: Prepare checked FFmpeg test dependency
        run: python tools/build_tracker.py --prepare-ffmpeg
      - name: Enable bundled FFmpeg for render tests
        shell: pwsh
        run: (Resolve-Path 'build/test-ffmpeg').Path >> $env:GITHUB_PATH
      - name: Repository and release tests
        run: python -m unittest discover -s tests -v
      - name: Tracker and Lua bridge tests
        working-directory: apps/ass-tracker
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows application
        run: python tools/build_tracker.py
      - name: Portable runtime without Python or FFmpeg in PATH
        run: python tools/check_portable.py
      - name: Generate and validate prospective feed
        run: >-
          python tools/sync_dependency_control.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --write --plan .release-plan.json

  release:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            apps/ass-tracker/requirements*.txt
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-ci.txt -r apps/ass-tracker/requirements-build.txt lupa==2.8
      - name: Prepare checked FFmpeg test dependency
        run: python tools/build_tracker.py --prepare-ffmpeg
      - name: Enable bundled FFmpeg for render tests
        shell: pwsh
        run: (Resolve-Path 'build/test-ffmpeg').Path >> $env:GITHUB_PATH
      - name: Repository and release tests
        run: python -m unittest discover -s tests -v
      - name: Tracker and Lua bridge tests
        working-directory: apps/ass-tracker
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows application
        run: python tools/build_tracker.py
      - name: Portable runtime without Python or FFmpeg in PATH
        run: python tools/check_portable.py
      - name: Generate and validate prospective feed
        run: >-
          python tools/sync_dependency_control.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --write --plan .release-plan.json
      - name: Publish verified assets then update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/publish_releases.py --plan .release-plan.json --commit "${{ github.sha }}"
